name: Build macOS app

on:
  push:
    branches: [ci/build-app]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build
        run: |
          xcodebuild \
            -project "Quest For Duskara.xcodeproj" \
            -scheme "Quest For Duskara" \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package app
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          echo "Built: $APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" QuestForDuskara.app.zip
          shasum -a 256 QuestForDuskara.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: QuestForDuskara-app
          path: QuestForDuskara.app.zip
          if-no-files-found: error
          retention-days: 7
